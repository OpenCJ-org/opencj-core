// In the CoD4 console: /exec opencj_cpc_keys.cfg
// Replaces these numpad bindings only. Normal save/load controls are untouched.
bind KP_INS "say !cp detect"
bind KP_5 "say !cp detect"
bind KP_ENTER "say !cp confirm"
bind KP_PLUS "say !cp corner"
bind KP_MINUS "say !cp undo"
bind KP_UPARROW "say !cp ele"
bind KP_END "say !cp double"
bind KP_DOWNARROW "say !cp ground"
bind KP_PGDN "say !cp allowsave"
bind KP_PGUP "say !cp finish"
bind KP_LEFTARROW "say !cp previous"
bind KP_RIGHTARROW "say !cp next"
bind KP_HOME "say !cp height"
bind KP_SLASH "say !cp alternative"
bind KP_STAR "say !cp area"

// Num 7: height editing On / Off; Num +/- adjusts by 4 units.
