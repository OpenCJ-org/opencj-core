# Static file server for the generated site. It has no access to the database
# or the game server; it only reads the generator's output volume.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # The site only serves files: refuse request bodies.
    client_max_body_size 1k;

    server {
        listen 8080;
        root /srv/output/current;
        index index.html;
        error_page 404 /404.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # Static files only: anything other than GET and HEAD is refused.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /static/ {
            expires 10m;
        }

        # Map files copied by the generator; only pool maps are ever present.
        location /usermaps/ {
            alias /srv/output/usermaps/;
            autoindex off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Disposition "attachment" always;
            types { }
            default_type application/octet-stream;
        }
    }
}
