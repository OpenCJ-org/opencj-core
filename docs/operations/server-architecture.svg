<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="716" viewBox="0 0 1120 716" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img">
  <title>OpenCJ server architecture</title>
  <desc>A rented game host runs main-eu, acceptance and map-test, each with its own database, plus the website, shared assets and scheduled jobs behind a firewall. A planned, currently switched-off host in another country would use the production database through an SSH tunnel; backups are copied nightly to an external backup server.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#5F5E5A"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#534AB7"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#854F0B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="716" rx="16" fill="#FFFFFF"/>

  <!-- Outside services -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="40" y="20" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="130" y="41" font-weight="600" fill="#2C2C2A">Players</text>
    <text x="130" y="59" font-size="11.5" fill="#5F5E5A">CoD4 clients</text>
    <rect x="255" y="20" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="345" y="41" font-weight="600" fill="#2C2C2A">Website visitors</text>
    <text x="345" y="59" font-size="11.5" fill="#5F5E5A">browsers</text>
    <rect x="470" y="20" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="560" y="41" font-weight="600" fill="#2C2C2A">Let's Encrypt</text>
    <text x="560" y="59" font-size="11.5" fill="#5F5E5A">HTTPS certificates</text>
    <rect x="685" y="20" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="775" y="41" font-weight="600" fill="#2C2C2A">DB-IP</text>
    <text x="775" y="59" font-size="11.5" fill="#5F5E5A">IP-country data</text>
    <rect x="900" y="20" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="990" y="41" font-weight="600" fill="#2C2C2A">Discord</text>
    <text x="990" y="59" font-size="11.5" fill="#5F5E5A">chat · private alerts</text>
  </g>

  <!-- Game host -->
  <rect x="40" y="110" width="1040" height="420" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <rect x="60" y="126" width="1000" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D"/>

  <!-- Connections to outside services (drawn after the host panel): inbound solid, outbound dashed -->
  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="130" y1="72" x2="130" y2="124" marker-end="url(#arrow-gray)"/>
    <line x1="345" y1="72" x2="345" y2="124" marker-end="url(#arrow-gray)"/>
    <line x1="560" y1="110" x2="560" y2="74" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
    <line x1="775" y1="110" x2="775" y2="74" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
    <line x1="990" y1="110" x2="990" y2="74" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  </g>
  <g font-size="11.5" fill="#444441">
    <text x="138" y="95">game (UDP)</text>
    <text x="353" y="95">HTTPS · maps (HTTP)</text>
    <text x="568" y="95">certificates</text>
    <text x="783" y="95">monthly data</text>
    <text x="998" y="95">bot · webhook</text>
  </g>
  <text x="560" y="148" text-anchor="middle" font-size="13" fill="#791F1F"><tspan font-weight="600">Firewall (ufw)</tspan>  ·  open: SSH (rate-limited), game ports, 80/443  ·  everything else closed  ·  fail2ban</text>

  <!-- Server columns -->
  <g fill="#FFFFFF" stroke="#D3D1C7">
    <rect x="60" y="180" width="300" height="224" rx="10"/>
    <rect x="376" y="180" width="200" height="224" rx="10"/>
    <rect x="592" y="180" width="200" height="224" rx="10"/>
    <rect x="808" y="180" width="252" height="224" rx="10"/>
  </g>
  <g font-size="13.5" font-weight="600" fill="#2C2C2A">
    <text x="76" y="203">main-eu <tspan font-weight="400" fill="#5F5E5A">· public</tspan></text>
    <text x="392" y="203">acceptance <tspan font-weight="400" fill="#5F5E5A">· private</tspan></text>
    <text x="608" y="203">map-test <tspan font-weight="400" fill="#5F5E5A">· private</tspan></text>
    <text x="824" y="203">Website</text>
  </g>

  <!-- Boxes: game servers (teal), databases (purple), services (gray), website (blue) -->
  <g font-size="13" text-anchor="middle">
    <rect x="76" y="216" width="128" height="48" rx="7" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="140" y="236" font-weight="600" fill="#085041">Game server</text>
    <text x="140" y="253" font-size="11.5" fill="#0F6E56">players, records</text>
    <rect x="216" y="216" width="128" height="48" rx="7" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="280" y="236" font-weight="600" fill="#3C3489">Production DB</text>
    <text x="280" y="253" font-size="11.5" fill="#534AB7">MySQL 8.0</text>
    <rect x="76" y="276" width="128" height="48" rx="7" fill="#F1EFE8" stroke="#888780"/>
    <text x="140" y="296" font-weight="600" fill="#2C2C2A">Discord bridge</text>
    <text x="140" y="313" font-size="11.5" fill="#5F5E5A">server chat</text>
    <rect x="216" y="276" width="128" height="48" rx="7" fill="#F1EFE8" stroke="#888780"/>
    <text x="280" y="296" font-weight="600" fill="#2C2C2A">GeoIP updater</text>
    <text x="280" y="313" font-size="11.5" fill="#5F5E5A">scoreboard flags</text>

    <rect x="392" y="216" width="168" height="48" rx="7" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="476" y="236" font-weight="600" fill="#085041">Game server</text>
    <text x="476" y="253" font-size="11.5" fill="#0F6E56">tests releases</text>
    <rect x="392" y="276" width="168" height="48" rx="7" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="476" y="296" font-weight="600" fill="#3C3489">Database copy</text>
    <text x="476" y="313" font-size="11.5" fill="#534AB7">copy of production</text>

    <rect x="608" y="216" width="168" height="48" rx="7" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="692" y="236" font-weight="600" fill="#085041">Game server</text>
    <text x="692" y="253" font-size="11.5" fill="#0F6E56">new and secret maps</text>
    <rect x="608" y="276" width="168" height="48" rx="7" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="692" y="296" font-weight="600" fill="#3C3489">Own database</text>
    <text x="692" y="313" font-size="11.5" fill="#534AB7">clean, separate</text>

    <rect x="824" y="216" width="220" height="48" rx="7" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="934" y="236" font-weight="600" fill="#0C447C">Caddy</text>
    <text x="934" y="253" font-size="11.5" fill="#185FA5">HTTPS, map downloads over HTTP</text>
    <rect x="824" y="276" width="220" height="48" rx="7" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="934" y="296" font-weight="600" fill="#0C447C">Web server</text>
    <text x="934" y="313" font-size="11.5" fill="#185FA5">static pages, pool maps</text>
    <rect x="824" y="336" width="220" height="48" rx="7" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="934" y="356" font-weight="600" fill="#0C447C">Page generator</text>
    <text x="934" y="373" font-size="11.5" fill="#185FA5">read-only database account</text>
  </g>

  <!-- Column notes -->
  <g font-size="11.5" fill="#5F5E5A">
    <text x="76" y="356">Backups + off-site copy, run pruning</text>
    <text x="76" y="374">Own Linux users and database accounts</text>
    <text x="392" y="356">Refreshed from main</text>
    <text x="392" y="374">Never writes to main</text>
    <text x="608" y="356">Map hidden from lists</text>
    <text x="608" y="374">Maps only with password</text>
  </g>

  <!-- Production database copied to acceptance -->
  <path d="M344 240 H368 V300 H390" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>

  <!-- Shared assets and scheduled jobs -->
  <rect x="60" y="424" width="490" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="76" y="446" font-size="13" font-weight="600" fill="#2C2C2A">Shared assets <tspan font-weight="400" fill="#5F5E5A">(read-only, one copy for all servers)</tspan></text>
  <text x="76" y="466" font-size="11.5" fill="#5F5E5A">game files · custom maps · compiled mod files</text>
  <rect x="566" y="424" width="494" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="582" y="446" font-size="13" font-weight="600" fill="#633806">Scheduled jobs <tspan font-weight="400" fill="#854F0B">(Europe/Amsterdam)</tspan></text>
  <text x="582" y="466" font-size="11.5" fill="#854F0B">backups 03:30 · pruning 04:15 · updates 05:00 · watchdog every 2 min</text>

  <text x="60" y="510" font-size="14" font-weight="600" fill="#2C2C2A">Game host <tspan font-weight="400" fill="#5F5E5A">· rented Ubuntu 24.04 server · /srv/opencj</tspan></text>
  <text x="1060" y="510" text-anchor="end" font-size="11.5" fill="#5F5E5A">every server: own containers, Linux users and database account</text>

  <!-- Links between machines -->
  <line x1="210" y1="560" x2="210" y2="532" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="218" y="550" font-size="11.5" fill="#3C3489">SSH tunnel to the production database</text>
  <line x1="830" y1="530" x2="830" y2="558" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="838" y="550" font-size="11.5" fill="#633806">nightly backups (write-only)</text>

  <!-- Planned other host (switched off until tested) -->
  <rect x="40" y="560" width="500" height="96" rx="14" fill="#F7F7F5" stroke="#B4B2A9" stroke-dasharray="6 4"/>
  <text x="60" y="582" font-size="13.5" font-weight="600" fill="#2C2C2A">Planned other host <tspan font-weight="400" fill="#5F5E5A">· e.g. main-us · switched off until tested</tspan></text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="596" width="200" height="48" rx="7" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="160" y="616" font-weight="600" fill="#085041">Game server</text>
    <text x="160" y="633" font-size="11.5" fill="#0F6E56">own database account</text>
    <rect x="280" y="596" width="240" height="48" rx="7" fill="#F1EFE8" stroke="#888780"/>
    <text x="400" y="616" font-weight="600" fill="#2C2C2A">SSH tunnel</text>
    <text x="400" y="633" font-size="11.5" fill="#5F5E5A">can reach the database port only</text>
  </g>

  <!-- External backup server -->
  <rect x="580" y="560" width="500" height="96" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <text x="600" y="582" font-size="13.5" font-weight="600" fill="#2C2C2A">External backup server <tspan font-weight="400" fill="#5F5E5A">· another location</tspan></text>
  <rect x="600" y="596" width="460" height="48" rx="7" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="830" y="616" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Received backups</text>
  <text x="830" y="633" text-anchor="middle" font-size="11.5" fill="#854F0B">write-only · daily 14 days, weekly 8 weeks, monthly 1 year · max 50 GiB</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#444441">
    <rect x="40" y="680" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="58" y="690">Game servers</text>
    <rect x="160" y="680" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="178" y="690">Databases</text>
    <rect x="262" y="680" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="280" y="690">Website</text>
    <rect x="350" y="680" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="368" y="690">Backups and jobs</text>
    <rect x="490" y="680" width="12" height="12" rx="3" fill="#FCEBEB" stroke="#A32D2D"/>
    <text x="508" y="690">Protection</text>
    <rect x="598" y="680" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#888780"/>
    <text x="616" y="690">Services and outside parties</text>
    <line x1="820" y1="686" x2="852" y2="686" stroke="#5F5E5A" stroke-width="1.5"/>
    <text x="860" y="690">inbound</text>
    <line x1="920" y1="686" x2="952" y2="686" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="960" y="690">outbound / copy</text>
  </g>
</svg>
